name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Build runs Next.js in production mode, which requires SESSION_SECRET.
      # The value is only used to sign cookies during the build — not persisted.
      SESSION_SECRET: ci-build-only-not-a-real-secret-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npx next build
